# Doc space manifest (schemas/docspace.schema.json in the Platform).
# The Older cloud Doc space Devant (.scratch/new-cloud-model decisions 5, 11
# and 14): the old Cloud of Integration, WSO2 Cloud's Integration Platform
# (wso2/docs-integrator saas, live at wso2.com/integration-platform/docs/saas/),
# as the Doc space integration held it until Choreo Integration replaced it.
schemaVersion: 1
slug: devant
displayName: Devant
# Unlisted: in no products menu or Docs section, out of every wider search,
# noindex and out of the sitemap; reached from the Landing page's Older cloud bar.
listed: false
owners:
  team: integration-docs
repo: hevayo/docs-integrator
editLinks: true
issues:
  repo: wso2/docs-integrator
# The team notice (decision 11): a notice is plain text, so it names the new
# Cloud rather than linking it.
notices:
  - level: info
    text: These are the docs for Devant, which came before Choreo Cloud. For Choreo Cloud's integration docs, open Integration on the docs home.
# The old console (decision 17): the Action button Integration's Cloud had.
cta: { icon: oxygen/bolt, label: Try it, url: "https://console.devant.dev/signup" }
editions:
  - id: cloud
